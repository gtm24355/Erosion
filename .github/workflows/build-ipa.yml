name: Build Erosion IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid
        run: brew install ldid

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Erosion.xcodeproj \
            -scheme Erosion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedDataApp \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            build

      - name: Apply entitlements and package IPA
        run: |
          set -euo pipefail
          app="build/DerivedDataApp/Build/Products/Release-iphoneos/Erosion.app"
          test -d "$app"
          ldid -S"Erosion/Erosion.entitlements" "$app"
          mkdir -p Payload
          cp -R "$app" Payload/Erosion.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Erosion.ipa
          unzip -t Erosion.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-iOS-IPA
          path: Erosion.ipa
          if-no-files-found: error
